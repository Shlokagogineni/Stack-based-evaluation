<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postfix Evaluator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Postfix Evaluator</h1>

    <input type="text" id="expression" placeholder="Enter infix or postfix expression">

    <button onclick="convertToPostfix()">
        Convert Infix → Postfix
    </button>

    <button onclick="evaluateOnly()">
        Evaluate Postfix
    </button>

    <div class="result" id="result">
        Result will appear here
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
